services:
  mlflow_db:
    image: postgres:17
    container_name: mlflow_db
    # The image ignores POSTGRES_PORT, so set the listen port via flag
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:?set MLFLOW_DB_USER in the environment}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in the environment}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    ports:
      - "5433:5433"
    volumes:
      # Host folder, ignored by git via .storage/.gitignore
      - ../.storage/mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${MLFLOW_DB_USER:-postgres} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Phoenix backend store.
  phoenix_db:
    image: postgres:17
    container_name: phoenix_db
    environment:
      POSTGRES_USER: ${PHOENIX_DB_USER:?set PHOENIX_DB_USER in the environment}
      POSTGRES_PASSWORD: ${PHOENIX_DB_PASSWORD:?set PHOENIX_DB_PASSWORD in the environment}
      POSTGRES_DB: ${PHOENIX_DB_NAME:-phoenix}
    ports:
      # Host 5434 avoids a local Postgres (5432) and mlflow_db (5433);
      # the container itself listens on Postgres' default 5432.
      - "5434:5432"
    volumes:
      # Host folder, ignored by git via .storage/.gitignore
      - ../.storage/phoenix_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PHOENIX_DB_USER:-postgres} -d ${PHOENIX_DB_NAME:-phoenix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Agent database store.
  agent_db:
    image: postgres:17
    container_name: agent_db
    environment:
      POSTGRES_USER: ${AGENT_DB_USER:?set AGENT_DB_USER in the environment}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in the environment}
      POSTGRES_DB: ${AGENT_DB_NAME:-agent}
    ports:
      # Host 5435 avoids a local Postgres (5432), mlflow_db (5433), and
      # phoenix_db (5434); the container itself listens on Postgres' default
      # 5432.
      - "5435:5432"
    volumes:
      # Host folder, ignored by git via .storage/.gitignore
      - ../.storage/agent_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_DB_USER:-postgres} -d ${AGENT_DB_NAME:-agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meta-search backend for the search tool. Official image from
  # https://docs.searxng.org/admin/installation-docker.html
  searxng:
    # Pinned to a specific release tag; bump deliberately when updating.
    image: searxng/searxng:2026.11.2-cccbc9e15
    container_name: searxng
    environment:
      # Required server secret (min 32 chars). Login protection is not
      # available, so use this fixed, documented default for local dev;
      # override with SEARXNG_SECRET if you prefer.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-searxng-local-development-secret}
      # Entrypoint chowns the mounted config/cache folders to the
      # container user (uid/gid 977) at (re)start.
      FORCE_OWNERSHIP: "true"
      # Point the bot-detection limiter at the valkey sidecar.
      SEARXNG_VALKEY_URL: valkey://searxng_valkey:6379/0
    depends_on:
      searxng_valkey:
        condition: service_healthy
    ports:
      # Unusual host port to avoid conflicts with common services.
      - "8384:8080"
    volumes:
      # Host folders, ignored by git via .storage/.gitignore
      - ../.storage/searxng_config:/etc/searxng
      - ../.storage/searxng_cache:/var/cache/searxng
      # Read-only settings overlay; the container-generated settings.yml
      # stays underneath in .storage/searxng_config.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -qO- http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey DB backing SearXNG's bot-detection limiter (part of the official
  # compose template). Internal service: no host port is exposed.
  # The image runs as root, so the host folder needs no special ownership;
  # the permissions_fixer keeps it world-readable for the host user.
  searxng_valkey:
    image: valkey/valkey:9.1.3-alpine
    container_name: searxng_valkey
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    volumes:
      # Host folder, ignored by git via .storage/.gitignore
      - ../.storage/searxng_valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  permissions_fixer:
    build:
      context: ./permissions_fixer
    image: tech-market-researcher/permissions-fixer:local
    container_name: permissions_fixer
    environment:
      TARGET_DIRS: "/phoenix_db /mlflow_db /agent_db /minio /pgadmin /searxng_config /searxng_cache /searxng_valkey"
      CRON_SCHEDULE: "*/1 * * * *"
    depends_on:
      mlflow_db:
        condition: service_healthy
      phoenix_db:
        condition: service_healthy
      agent_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../.storage/phoenix_db:/phoenix_db
      - ../.storage/mlflow_db:/mlflow_db
      - ../.storage/agent_db:/agent_db
      - ../.storage/minio:/minio
      - ../.storage/pgadmin:/pgadmin
      - ../.storage/searxng_config:/searxng_config
      - ../.storage/searxng_cache:/searxng_cache
      - ../.storage/searxng_valkey:/searxng_valkey
    restart: "no"

  minio:
    # S3-compatible object storage for MLflow artifacts. Data lives in its own
    # host folder (.storage/minio), visible directly, separate from the old
    # mlflow_artifacts path.
    # NOTE: minio/minio is unavailable on Docker Hub from this network;
    # alpine/minio is a mirror of the official image. Pinned to a release tag.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      # MinIO requires a root password (min 8 chars); login cannot be
      # disabled, so use this fixed, documented default for local dev.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mlflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      # Host folder, ignored by git via .storage/.gitignore
      - ../.storage/minio:/data
    # The alpine/minio image has no standalone curl; busybox wget probes the
    # S3 liveness endpoint.
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -qO- http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    # Web UI for the MLflow Postgres database. pgAdmin requires a login
    # (login cannot be disabled), so this uses a fixed, documented local
    # default; override with PGADMIN_PASSWORD if you prefer.
    # The mlflow_db server is pre-configured with the .env credentials:
    # entrypoint.sh renders the server list before the real entrypoint runs,
    # and the image loads it at startup.
    image: dpage/pgadmin4:9.19
    container_name: pgadmin
    entrypoint: ["/pgadmin-init/entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin12345}
      # The config DB persists in .storage/pgadmin, so without this flag the
      # image's entrypoint would re-import the server list only on first
      # launch and never pick up servers added to the rendered JSON later.
      # With "True", every start re-loads the JSON (replacing the stored
      # list), keeping it as the source of truth.
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      # Passed through so entrypoint.sh can render the pre-configured server list.
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in the environment}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      PHOENIX_DB_USER: ${PHOENIX_DB_USER:?set PHOENIX_DB_USER in the environment}
      PHOENIX_DB_PASSWORD: ${PHOENIX_DB_PASSWORD:?set PHOENIX_DB_PASSWORD in the environment}
      PHOENIX_DB_NAME: ${PHOENIX_DB_NAME:-phoenix}
      AGENT_DB_USER: ${AGENT_DB_USER:?set AGENT_DB_USER in the environment}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in the environment}
      AGENT_DB_NAME: ${AGENT_DB_NAME:-agent}
      # Rendered by entrypoint.sh at container start.
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      # Display name of the pre-configured MLflow server in the pgAdmin UI.
      PGADMIN_SERVER_NAME: "MLflow (Postgres)"
      # Display name of the pre-configured Phoenix server in the pgAdmin UI.
      PHOENIX_SERVER_NAME: "Phoenix (Postgres)"
      # Display name of the pre-configured agent server in the pgAdmin UI.
      AGENT_SERVER_NAME: "Agent (Postgres)"
    depends_on:
      mlflow_db:
        condition: service_healthy
      phoenix_db:
        condition: service_healthy
      agent_db:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      # Host folder, ignored by git via .storage/.gitignore
      - ../.storage/pgadmin:/var/lib/pgadmin
      # Entrypoint wrapper that renders the pre-configured server list.
      - ./pgadmin:/pgadmin-init

  mlflow_server:
    build:
      context: ./mlflow_server
    image: tech-market-researcher/mlflow:local
    container_name: mlflow_server
    depends_on:
      mlflow_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Artifacts are stored in MinIO (S3-compatible). With --serve-artifacts
      # clients upload via this server's REST API, so nothing on the host
      # needs S3 credentials or access to a local artifact path.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Hosts clients may use to reach this server (DNS-rebinding protection).
      # Replaces MLflow's default list; the :* patterns match port-suffixed
      # Host headers (e.g. "localhost:5000").
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow_server,mlflow_server:*,${TAILSCALE_HOST_NAME:-localhost},${TAILSCALE_HOST_NAME:-localhost}:*"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the environment}
      # Comma-separated list of URL schemes allowed for model provider API bases.
      # MLflow splits this list automatically.
      MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES: ${MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES:-https}
      # Set to "true" to allow provider API bases that resolve to private network IPs.
      MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS: ${MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS:-false}
      # AI Gateway timeout for requests proxied to model providers. Local oMLX
      # models can take long to respond in some cases, so allow more than the
      # 300-second default.
      MLFLOW_GATEWAY_ROUTE_TIMEOUT_SECONDS: ${MLFLOW_GATEWAY_ROUTE_TIMEOUT_SECONDS:-900}
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_DB_USER:?set MLFLOW_DB_USER in the environment}:${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in the environment}@mlflow_db:5433/${MLFLOW_DB_NAME:-mlflow}
      --default-artifact-root s3://mlflow-artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

  # Phoenix: LLM/agent observability server + UI (traces, evals).
  # Pinned to a specific release tag; must be > 4.0 to support the SQL
  # (Postgres) backend.
  phoenix_server:
    image: arizephoenix/phoenix:21.0.0
    container_name: phoenix_server
    depends_on:
      phoenix_db:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${PHOENIX_DB_USER:?set PHOENIX_DB_USER in the environment}:${PHOENIX_DB_PASSWORD:?set PHOENIX_DB_PASSWORD in the environment}@phoenix_db:5432/${PHOENIX_DB_NAME:-phoenix}
      # Disable the login screen. Left unset, the Docker image's non-loopback
      # bind (::) would auto-enable authentication.
      PHOENIX_ENABLE_AUTH: "false"
      # Encrypts credentials saved by the UI (e.g. annotation providers). Left
      # unset, Phoenix falls back to a default key. Override with
      # PHOENIX_ENCRYPTION_SECRET if you prefer.
      PHOENIX_SECRET: ${PHOENIX_ENCRYPTION_SECRET:-phoenix-local-development-secret}
    ports:
      - "6006:6006"   # UI and OTLP HTTP collector
      - "4317:4317"   # OTLP gRPC collector
    healthcheck:
      # The image ships no shell, so probe with its own interpreter. A plain
      # HTTP 200 is unreliable (Phoenix serves the SPA for any path), so query
      # the GraphQL API instead: it returns data only once the backend and
      # database are actually serving.
      test:
        - CMD
        - /usr/bin/python3.13
        - -c
        - |
          import urllib.request, json, sys
          q = "{ projects { edges { node { id } } } }"
          req = urllib.request.Request(
              "http://127.0.0.1:6006/graphql",
              data=json.dumps({"query": q}).encode(),
              headers={"content-type": "application/json"},
              method="POST",
          )
          body = json.load(urllib.request.urlopen(req, timeout=3))
          sys.exit(0 if body.get("data") is not None and not body.get("errors") else 1)
      interval: 10s
      timeout: 5s
      retries: 5
