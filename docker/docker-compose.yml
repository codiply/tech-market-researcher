services:
  mlflow_db:
    image: postgres:17
    container_name: mlflow_db
    # The image ignores POSTGRES_PORT, so set the listen port via flag
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:?set MLFLOW_DB_USER in the environment}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in the environment}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    ports:
      - "5433:5433"
    volumes:
      # Host folder, ignored by git via storage/.gitignore
      - ../storage/mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${MLFLOW_DB_USER:-postgres} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  permissions_fixer:
    build:
      context: ./permissions_fixer
    image: tech-market-researcher/permissions-fixer:local
    container_name: permissions_fixer
    environment:
      TARGET_DIRS: "/mlflow_db /minio /pgadmin"
      CRON_SCHEDULE: "*/1 * * * *"
    depends_on:
      mlflow_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../storage/mlflow_db:/mlflow_db
      - ../storage/minio:/minio
      - ../storage/pgadmin:/pgadmin
    restart: "no"

  minio:
    # S3-compatible object storage for MLflow artifacts. Data lives in its own
    # host folder (storage/minio), visible directly, separate from the old
    # mlflow_artifacts path.
    # NOTE: minio/minio is unavailable on Docker Hub from this network;
    # alpine/minio is a mirror of the official image. Pinned to a release tag.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      # MinIO requires a root password (min 8 chars); login cannot be
      # disabled, so use this fixed, documented default for local dev.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mlflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      # Host folder, ignored by git via storage/.gitignore
      - ../storage/minio:/data
    # The alpine/minio image has no standalone curl; busybox wget probes the
    # S3 liveness endpoint.
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -qO- http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    # Web UI for the MLflow Postgres database. pgAdmin requires a login
    # (login cannot be disabled), so this uses a fixed, documented local
    # default; override with PGADMIN_PASSWORD if you prefer.
    # The mlflow_db server is pre-configured with the .env credentials:
    # entrypoint.sh renders the server list before the real entrypoint runs,
    # and the image loads it at startup.
    image: dpage/pgadmin4:9.19
    container_name: pgadmin
    entrypoint: ["/pgadmin-init/entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin12345}
      # Passed through so entrypoint.sh can render the pre-configured server list.
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in the environment}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
      # Rendered by entrypoint.sh at container start.
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      # Display name of the pre-configured server in the pgAdmin UI.
      PGADMIN_SERVER_NAME: "MLflow (Postgres)"
    depends_on:
      mlflow_db:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      # Host folder, ignored by git via storage/.gitignore
      - ../storage/pgadmin:/var/lib/pgadmin
      # Entrypoint wrapper that renders the pre-configured server list.
      - ./pgadmin:/pgadmin-init

  mlflow_server:
    build:
      context: ./mlflow_server
    image: tech-market-researcher/mlflow:local
    container_name: mlflow_server
    depends_on:
      mlflow_db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Artifacts are stored in MinIO (S3-compatible). With --serve-artifacts
      # clients upload via this server's REST API, so nothing on the host
      # needs S3 credentials or access to a local artifact path.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mlflow}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the environment}
      # Comma-separated list of URL schemes allowed for model provider API bases.
      # MLflow splits this list automatically.
      MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES: ${MLFLOW_GATEWAY_API_BASE_ALLOWED_SCHEMES:-https}
      # Set to "true" to allow provider API bases that resolve to private network IPs.
      MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS: ${MLFLOW_GATEWAY_API_BASE_ALLOW_PRIVATE_IPS:-false}
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_DB_USER:?set MLFLOW_DB_USER in the environment}:${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in the environment}@mlflow_db:5433/${MLFLOW_DB_NAME:-mlflow}
      --default-artifact-root s3://mlflow-artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
