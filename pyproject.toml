[project]
name = "tech-market-researcher"
version = "0.1.0"
description = "Tech market researcher agent"
readme = "README.md"
authors = [
    { name = "Panagiotis Katsaroumpas", email = "codiply@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents~=0.7.32",
    "langchain-openai~=1.7.3",
    "rich~=15.0.0",
    "mlflow~=3.17.2",
    "python-dotenv~=1.2.4",
    "boto3~=1.43.123",
    "pydantic~=2.14.2",
    "pyyaml~=6.0.3",
]

[project.scripts]
agent = "tech_market_researcher.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy~=2.4.1",
    "isort~=9.0.2",
    "pylint~=4.1.3",
    "black~=26.10.1",
    "boto3-stubs~=1.43.123",
    "types-pyyaml~=6.0.12.20261030",
]

[tool.black]
target-version = ["py314"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.14"
