[project]
name = "tech-market-researcher"
version = "0.1.0"
description = "Tech market researcher agent"
readme = "README.md"
authors = [
    { name = "Panagiotis Katsaroumpas", email = "codiply@gmail.com" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "deepagents~=0.7.32",
    "langchain-openai~=1.7.3",
    "rich~=15.0.0",
    "mlflow~=3.17.2",
    "arize-otel~=0.14.1",
    "openinference-instrumentation-langchain~=0.1.82",
    "python-dotenv~=1.2.4",
    "boto3~=1.43.123",
    "pydantic~=2.14.2",
    "pyyaml~=6.0.3",
    "jinja2~=3.1.6",
    "tavily-python~=0.8.5",
    "httpx~=0.28.1",
    "markdownify~=1.2.3",
    "arize-phoenix~=21.0.0",
    "gradio~=6.32.0",
]

[project.scripts]
agent_cli = "tech_market_researcher.agent_cli:main"
agent_gradio_app = "tech_market_researcher.agent_gradio_app:main"
bootstrap = "bootstrapping.main:main"
evals = "evaluations.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy~=2.4.1",
    "isort~=9.0.2",
    "pylint~=4.1.3",
    "black~=26.10.1",
    "boto3-stubs~=1.43.123",
    "types-pyyaml~=6.0.12.20261030",
    "pytest~=9.2.0",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint."FORMAT"]
max-line-length = 120

[tool.mypy]
python_version = "3.14"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tavily"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arize.*"]
ignore_missing_imports = true
