AWSTemplateFormatVersion: '2010-09-09'
Description: Inference Server for LLMs

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: '1. Naming'
        Parameters:
          - Version
          - Ec2InstanceNamePrefix
      - Label:
          default: '2. Launch Configuration'
        Parameters:
          - InstanceType
          - LatestAmiId
          - VolumeSizeGb
          - VolumeThroughputMbs
          - IsSpotInstance
      - Label:
          default: '3. Network Access'
        Parameters:
          - AccessPrefixListId
          - VpcId
          - KeyPairName
      - Label:
          default: '4. Tailscale'
        Parameters:
          - TailscaleTag
          - TailscaleHostname
          - TailscaleAuthKeyParameterName
      - Label:
          default: '5. Model'
        Parameters:
          - Model

Parameters:
  Version:
    Type: String
    Default: v1
    Description: Version suffix appended to the launch template name.

  Ec2InstanceNamePrefix:
    Type: String
    Default: inference
    Description: >
      Prefix for the name tag applied to the EC2 instance and its resources
      (volume, network interface, spot request). The full name is
      <prefix>-<version>-<model> (e.g. inference-v1-Qwen3-4B).

  InstanceType:
    Type: String
    Default: g6e.xlarge
    AllowedValues:
      - g6e.xlarge
      - g6e.2xlarge
      - g6.xlarge
      - g6.2xlarge
      - g4dn.xlarge
      - g4dn.2xlarge
    Description: >
      EC2 instance type for the inference server. g6e instances have the
      L40S GPU with 48 GB; g6 instances have the L4 GPU with 24 GB; g4dn
      instances have a T4 GPU with 16 GB. All use AMD EPYC (amd64) CPUs and
      share the same Ubuntu AMI.

  VolumeSizeGb:
    Type: Number
    Default: 100
    MinValue: 30
    MaxValue: 16384
    Description: Size (GB) of the encrypted root EBS volume.

  VolumeThroughputMbs:
    Type: Number
    Default: 750
    MinValue: 125
    MaxValue: 1000
    Description: Throughput (MB/s) of the gp3 root EBS volume.

  # Latest Ubuntu 26.04 server (amd64) AMI, resolved per region via Canonical's
  # SSM parameter store (see ubuntu.com/aws/docs, "Build CloudFormation
  # templates"). Must stay amd64: g6e/g6 use AMD EPYC (x86_64) CPUs.
  # Format:
  #   ubuntu/$PRODUCT/$RELEASE/stable/current/$ARCH/$VIRT_TYPE/$VOL_TYPE/ami-id
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/26.04/stable/current/amd64/hvm/ebs-gp3/ami-id'

  AccessPrefixListId:
    Type: String
    AllowedPattern: "^pl-[0-9a-f]{8,17}$"
    Description: >
      Id of the managed prefix list allowed to open SSH (port 22) on the
      instance, e.g. pl-12345678.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the inference server into.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair attached to the instance for SSH access.

  TailscaleTag:
    Type: String
    Default: sandbox
    AllowedPattern: "^(?!tag:)[a-z0-9-]+(\\.[a-z0-9-]+)*$"
    Description: >
      Tailscale tag advertised by the instance, without the "tag:" prefix
      (e.g. "sandbox"). The auth key (or a pre-approved tag) must grant this
      tag, or the node's membership will fail.

  TailscaleHostname:
    Type: String
    Default: ec2-inference-server
    AllowedPattern: "^[A-Za-z0-9-]+$"
    Description: >
      Hostname the instance registers with the Tailscale admin panel and
      advertises on the tailnet (used as the --hostname for `tailscale
      login`), e.g. ec2-inference-server. The tailnet DNS name is derived
      from it (ec2-inference-server.<tailnet>.ts.net).

  TailscaleAuthKeyParameterName:
    Type: String
    Default: tailscale-auth-key
    Description: >
      Name of the SSM SecureString parameter holding the Tailscale auth key,
      in the same region as the stack, without a leading "/" (e.g.
      prod/tailscale/auth-key). It is read by the instance at boot; the
      instance role is granted ssm:GetParameter on it (plus kms:Decrypt if
      the parameter is encrypted with a customer-managed KMS key). Rotating
      the key is a put-parameter; newly launched instances pick it up
      without a stack update.

  IsSpotInstance:
    Type: String
    AllowedValues:
      - "Yes"
      - "No"
    Default: "No"
    Description: Provision a spot instance (Yes) or an on-demand instance (No).

  Model:
    Type: String
    Default: None
    AllowedValues:
      - None
      - Qwen3.8-27B-FP8
      - Qwen3.8-27B-NVFP4
      - Qwen3-4B
    Description: >
      Model to start serving automatically at the end of setup, by the name of
      its serve script (e.g. Qwen3.8-27B-FP8 starts serve-Qwen3.8-27B-FP8.sh). "None" leaves the server installed but not running.

Conditions:
  UseSpotInstance: !Equals [!Ref IsSpotInstance, "Yes"]

Resources:
  InferenceInstanceRole:
    Type: AWS::IAM::Role
    # Grants SSM access (aws ssm start-session) without SSH or a key pair.
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      # Lets the instance read the Tailscale auth key from the SSM
      # SecureString at boot. The kms:Decrypt statement is unscoped because
      # the template does not know the ARN of the customer-managed key (if
      # any) the parameter is encrypted with.
      Policies:
        - PolicyName: read-tailscale-auth-key
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${TailscaleAuthKeyParameterName}"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"

  InferenceInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InferenceInstanceRole

  InferenceServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: inference-server-sg
      GroupDescription: Allow SSH only from the managed prefix list
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourcePrefixListId: !Ref AccessPrefixListId

  InferenceServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    # Launch template names are unique per region and cannot be deleted while
    # an EC2 instance references them, so appending Version to the name forces
    # a new template to be created on stack update instead of a failing update.
    Properties:
      LaunchTemplateName: !Sub ${Ec2InstanceNamePrefix}-${Version}-${Model}
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyPairName
        IamInstanceProfile:
          Name: !Ref InferenceInstanceProfile
        # Sub runs only on the params.env chunk below: applying it to the
        # whole user-data would resolve every $ expression against template
        # parameters. The chunk exists because the Tailscale auth key is a
        # SecureString, which CloudFormation cannot resolve into a template
        # parameter, so the key is fetched from Parameter Store at boot.
        # (Fn::Join because !Base64 !Sub is not valid YAML.)
        UserData:
          # The setup script's source of truth is scripts/inference-setup.sh in
          # this directory. It exceeds EC2's 16 KiB user-data limit, so it is
          # shipped gzip+base64-compressed in the blob below; the trampoline
          # here decompresses it to /var/lib/inference-setup/setup.sh and runs
          # it. The reboot fallback re-runs this trampoline (part-001), which
          # re-decompresses and re-runs the same script.
          # Template parameters are handed to the script via params.env (a SSM
          # SecureString cannot be resolved by CloudFormation into the script,
          # and the blob must stay static, so no !Sub is possible inside it).
          # After editing scripts/inference-setup.sh, run:
          #   python3 generate_userdata.py
          # to rewrite the blob and re-check the size limit.
          Fn::Base64:
            Fn::Join:
              - ''
              - - |
                  #!/bin/bash
                  set -euo pipefail
                  export HOME="${HOME:-/root}"
                  mkdir -p /var/lib/inference-setup
                - !Sub |
                  cat > /var/lib/inference-setup/params.env <<'EOF'
                  MODEL="${Model}"
                  TS_AUTH_KEY_PARAM="${TailscaleAuthKeyParameterName}"
                  TS_TAG="${TailscaleTag}"
                  TS_HOSTNAME="${TailscaleHostname}"
                  EOF
                - |
                  echo "" | base64 -d | gunzip -c > /var/lib/inference-setup/setup.sh
                  bash /var/lib/inference-setup/setup.sh
        SecurityGroupIds:
          - !GetAtt InferenceServerSecurityGroup.GroupId
        InstanceMarketOptions:
          !If
            - UseSpotInstance
            - MarketType: spot
              SpotOptions:
                SpotInstanceType: one-time
                InstanceInterruptionBehavior: terminate
            - !Ref "AWS::NoValue"
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${Ec2InstanceNamePrefix}-${Version}-${Model}
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub ${Ec2InstanceNamePrefix}-${Version}-${Model}
          - ResourceType: network-interface
            Tags:
              - Key: Name
                Value: !Sub ${Ec2InstanceNamePrefix}-${Version}-${Model}
          - !If
              - UseSpotInstance
              - ResourceType: spot-instances-request
                Tags:
                  - Key: Name
                    Value: !Sub ${Ec2InstanceNamePrefix}-${Version}-${Model}
              - !Ref "AWS::NoValue"
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref VolumeSizeGb
              VolumeType: gp3
              Throughput: !Ref VolumeThroughputMbs
              Encrypted: true

Outputs:
  LaunchTemplateId:
    Description: Launch template used to provision the inference server
    Value: !Ref InferenceServerLaunchTemplate
