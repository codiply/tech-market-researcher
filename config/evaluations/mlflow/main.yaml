experiment_name: tech-market-researcher
dataset_name: mixed
judge_model_name: omlx.Qwen3.8-27B-oQ4e-mtp
# Keep these in alphabetical order.
scorers:
  completeness:
    enabled: true
  correctness:
    enabled: true
  equivalence:
    enabled: true
    inference_params:
      temperature: 0.1
  expectations_guidelines:
    enabled: true
  fluency:
    enabled: true
  guidelines:
    enabled: true
    instances:
      - name: language_english
        guidelines:
          - The text must be written in English.
      - name: tone_professional
        guidelines:
          - The text must maintain a professional tone.
  relevance_to_query:
    enabled: true
  retrieval_groundedness:
    enabled: true
  retrieval_relevance:
    enabled: true
    inference_params:
      temperature: 0.1
  retrieval_sufficiency:
    enabled: true
  safety:
    enabled: true
  summarization:
    enabled: true
  tool_call_correctness:
    enabled: true
    should_exact_match: false
    should_consider_ordering: false
  tool_call_efficiency:
    enabled: true
