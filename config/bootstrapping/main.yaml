debugging:
  dump_rendered_datasets: true
mlflow:
  llm_connections:
    - api_key_name: omlx-server
      provider: openai
      api_key_env_var_name: OMLX_API_KEY
      api_base_url_env_var_name: OMLX_BASE_URL
    - api_key_name: bedrock-eu
      provider: bedrock
      region_name: eu-west-1
      api_key_env_var_name: BEDROCK_API_KEY
  endpoints:
    - name: omlx.Qwen3.8-27B-oQ4e-mtp
      model_name: Qwen3.8-27B-oQ4e-mtp
      api_key_name: omlx-server
    - name: omlx.Qwen3.6-35B-A3B-oQ4e-mtp
      model_name: Qwen3.6-35B-A3B-oQ4e-mtp
      api_key_name: omlx-server
    - name: bedrock.eu.amazon.nova-micro-v1
      model_name: eu.amazon.nova-micro-v1:0
      api_key_name: bedrock-eu
    - name: bedrock.eu.amazon.nova-2-lite-v1
      model_name: eu.amazon.nova-2-lite-v1:0
      api_key_name: bedrock-eu
    - name: bedrock.eu.amazon.nova-pro-v1
      model_name: eu.amazon.nova-pro-v1:0
      api_key_name: bedrock-eu
  budget_policies:
    - amount_usd: 30.00
      reset_period: weekly
      action: reject
  datasets:
    - experiment: tech-market-researcher-evals
      dataset_name: with_expected_response
      local_directories:
        - human_generated
      filters:
        has_expected_response: true
    - experiment: tech-market-researcher-evals
      dataset_name: with_guideline
      local_directories:
        - human_generated
      filters:
        has_guidelines: true
    - experiment: tech-market-researcher-evals
      dataset_name: mixed
      local_directories:
        - human_generated
arize:
  datasets:
    - dataset_name: initial_test
      local_directories:
        - human_generated
  ai_providers:
    - provider_name: mlflow_ai_gateway
      description: MLflow AI Gateway
      sdk: openai
      provider_string: mlflow_ai_gateway
      sdk_specific_settings:
        api_type: chat_completions
        api_base_url_env_var_name: MLFLOW_AI_GATEWAY_CONTAINER_BASE_URL
  models:
    - model_name: omlx.Qwen3.8-27B-oQ4e-mtp
      name_pattern: Qwen3.8-27B-oQ4e-mtp
      provider: mlflow_ai_gateway
    - model_name: bedrock.eu.amazon.nova-2-lite-v1
      name_pattern: eu\.amazon\.nova-2-lite
      provider: mlflow_ai_gateway
      costs:
        input: 0.374
        output: 3.157
        cache_read: 0.0935
    - model_name: bedrock.eu.amazon.nova-micro-v1
      name_pattern: eu\.amazon\.nova-micro
      provider: mlflow_ai_gateway
      costs:
        input: 0.04
        output: 0.16
        cache_read: 0.01
    - model_name: bedrock.eu.amazon.nova-pro-v1
      name_pattern: eu\.amazon\.nova-pro
      provider: mlflow_ai_gateway
      costs:
        input: 0.92
        output: 3.68
        cache_read: 0.23
s3:
  buckets_to_create:
    - mlflow-artifacts
