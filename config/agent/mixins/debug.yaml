# Debug dumps written under .debug/.
debug:
  # Dumps every tool bound to the model (name, description, parameters) to
  # .debug/agent/tool-definitions/tool-definitions.json on agent creation.
  tool_definitions:
    enabled: true
  # Dumps the available-skills section injected into the agent's system prompt to
  # .debug/agent/skills/skills.md on agent creation.
  skills:
    enabled: true
