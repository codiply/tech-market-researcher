indexing:
  chroma_url_env_var: CHROMA_EVALS_URL
  # Scope every collection to the conversation's thread id, so one conversation
  # cannot influence the results of another.
  do_suffix_collection_name_with_thread_id: true
  # Tag every collection the agent creates, so the evals cleanup can delete exactly those.
  additional_collection_metadata:
    created_during_evals: "true"
supervisor:
  backend:
    # Keep the agent's on-disk files for eval runs separate from regular agent runs. The conditional
    # tag leaves the section alone when it is set by no lower layer, e.g. with the sandbox backend,
    # where the section must not exist.
    filesystem: !override-if-present
      root_dir: .storage/evals/agent/backend
logging:
  directory: .storage/evals/agent/logs
