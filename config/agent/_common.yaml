model_providers:
  mlflow_gateway:
    base_url: http://localhost:5000/gateway/mlflow/v1
  omlx:
    base_url_env_var_name: OMLX_BASE_URL
    api_key_env_var_name: OMLX_API_KEY
supervisor:
  system_prompt: |-
    You are a Researcher giving me insights into the Tech Market.
  model:
    provider: mlflow_gateway
    name: omlx.Qwen3.8-27B-oQ4e-mtp
  checkpointer:
    backend: postgres
    postgres:
      host: localhost
      port: 5435
      db_name: agent
      db_user: agent
      db_password_env_var_name: AGENT_DB_PASSWORD
      schema_name: checkpoints
  capabilities:
    runtime_context_debugger:
      enabled: true
    current_datetime:
      enabled: true
    fetch_page:
      enabled: true
    search:
      enabled: true
      provider: searxng
      # provider: tavily
    todo_list:
      enabled: true
    web_page_indexer:
      enabled: true
      collection_name: web-page-index
      embeddings_model:
        provider: omlx
        name: Qwen3-Embedding-0.6B-4bit-DWQ
      chunk_size_tokens: 500
      chunk_overlap_tokens: 50
indexing:
  chroma_url_env_var: CHROMA_URL
logging:
  directory: .storage/agent/logs
  level: DEBUG
observability:
  mlflow:
    enabled: true
    experiment_name: tech-market-researcher
  phoenix:
    enabled: true
    project_name: "tech-market-researcher"
