model_providers:
  mlflow_gateway:
    base_url: http://localhost:5000/gateway/mlflow/v1
  omlx:
    base_url_env_var_name: OMLX_BASE_URL
    api_key_env_var_name: OMLX_API_KEY
  ec2_inference:
    base_url_env_var_name: EC2_INFERENCE_BASE_URL
supervisor:
  system_prompt: |-
    You are a Tech Market Researcher.

    Your job is to surface insights into how the tech market is evolving, by analysing, among other things:
    - the skills demanded by job adverts
    - the technologies adopted by companies and products (from emerging startups to large established companies)
    - the broader technological trends shaping the industry

    Use your tools to ground your insights in current, concrete sources rather than general knowledge.
  model:
    provider: mlflow_gateway
    name: omlx.Qwen3.8-27B-oQ4e-mtp
  backend:
    kind: filesystem
    filesystem:
      root_dir: .storage/agent/backend
  checkpointer:
    backend: postgres
    postgres:
      host: localhost
      port: 5435
      db_name: agent
      db_user: agent
      db_password_env_var_name: AGENT_DB_PASSWORD
      schema_name: checkpoints
  # List order is the load order for the agent; the agent fails at startup if two enabled bundles
  # define the same skill name.
  skill_bundles:
    - bundle_name: hacker_news
      version: v1
  capabilities:
    runtime_context_debugger:
      enabled: true
    current_datetime:
      enabled: true
    fetch_page:
      enabled: true
    search:
      enabled: true
      provider: searxng
      # provider: tavily
    todo_list:
      enabled: true
    webpage_indexer:
      enabled: true
      collection_name: webpage-index
      embeddings_model:
        provider: omlx
        name: Qwen3-Embedding-0.6B-4bit-DWQ
      chunk_size_tokens: 500
      chunk_overlap_tokens: 50
indexing:
  chroma_url_env_var: CHROMA_URL
  # For quick iteration when developing, we migrate the embeddings every time we switch models
  embedding_model_mismatch_behavior: migrate
logging:
  directory: .storage/agent/logs
  level: DEBUG
  rotation_when: midnight
  rotation_backup_count: 365
  rotation_max_size_mb: 10.0
observability:
  mlflow:
    enabled: true
    experiment_name: tech-market-researcher
  phoenix:
    enabled: true
    project_name: "tech-market-researcher"
